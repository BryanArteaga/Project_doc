services:
  - type: web
    name: project-doc-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run build && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: postgres
          property: directConnectionString
      - key: JWT_SECRET
        sync: false
      - key: DOCTOR_TOKEN
        sync: false
      - key: PORT
        value: "3000"

databases:
  - name: postgres
    databaseName: project_doc_db
    user: postgres
    region: oregon
    plan: free
